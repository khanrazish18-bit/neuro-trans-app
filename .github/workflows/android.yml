name: Auto Unzip and Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract ZIP file
        run: |
          unzip "neuro-trans-app (1).zip" -d extracted_source
          cd extracted_source
          if [ -d "$(ls -d */ | head -n 1)" ] && [ ! -f "pubspec.yaml" ]; then
            mv $(ls -d */ | head -n 1)* ./
            mv $(ls -d */ | head -n 1).* ./ || true
          else
            mv ./* ../ || true
          fi
          cd ..
          rm -rf extracted_source

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: 'stable'

      # یہ نیا اور پکا سٹیپ اینڈرائیڈ کو گریڈل پلگ ان ورژن کی چیکنگ مکمل بند کرنے پر مجبور کرے گا
      - name: Bypass Android Gradle Plugin Validation
        run: |
          flutter clean
          mkdir -p ~/.android
          echo "android.experimental.skipDependencyValidation=true" >> android/local.properties
          echo "android.experimental.skipDependencyValidation=true" >> android/gradle.properties || true
          flutter pub get

      - name: Build Application APK
        run: |
          # فلیگ کے ساتھ بلڈ چلانا تاکہ پرانے ورژنز بلڈ کو نہ روک سکیں
          flutter build apk --debug --android-skip-build-dependency-validation

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Flutter-Built-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
