name: Auto Unzip and Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract ZIP file
        run: |
          unzip "neuro-trans-app (1).zip" -d extracted_source
          cd extracted_source
          if [ -d "$(ls -d */ | head -n 1)" ] && [ ! -f "pubspec.yaml" ]; then
            mv $(ls -d */ | head -n 1)* ./
            mv $(ls -d */ | head -n 1).* ./ || true
          else
            mv ./* ../ || true
          fi
          cd ..
          rm -rf extracted_source

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: 'stable'

      # یہ سٹیپ اینڈرائیڈ کی کنفیگریشن، SDK 36، NDK 28 اور گریڈل پلگ ان 8.9.1 کو خودکار طور پر اپگریڈ کرے گا
      - name: Fix Android Build Configuration
        run: |
          flutter clean
          
          # 1. اینڈرائیڈ روٹ کی build.gradle فائل میں گریڈل پلگ ان کو 8.9.1 پر اپگریڈ کرنا
          if [ -f "android/build.gradle" ]; then
            sed -i 's/com.android.application" version "[0-9.]*"/com.android.application" version "8.9.1"/g' android/build.gradle
          fi
          
          # 2. اینڈرائیڈ روٹ کی settings.gradle یا build.gradle (Kotlin DSL) میں پلگ ان اپگریڈ کرنا
          find android -name "settings.gradle*" -exec sed -i 's/com.android.application" version "[0-9.]*"/com.android.application" version "8.9.1"/g' {} +
          find android -name "build.gradle*" -exec sed -i 's/id("com.android.application") version "[0-9.]*"/id("com.android.application") version "8.9.1"/g' {} +
          
          # 3. compileSdk اور NDK ورژنز کو سیٹ کرنا
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/compileSdk = [0-9]*/compileSdk = 36/g' android/app/build.gradle.kts
            sed -i '/android {/a \    ndkVersion = "28.2.13676358"' android/app/build.gradle.kts
          fi
          
          flutter pub get

      - name: Build Application APK
        run: |
          flutter build apk --debug --android-skip-build-dependency-validation

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Flutter-Built-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
