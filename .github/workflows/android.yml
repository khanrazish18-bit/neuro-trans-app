name: Auto Unzip and Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract ZIP file
        run: |
          unzip "neuro-trans-app (1).zip" -d extracted_source
          cd extracted_source
          if [ -d "$(ls -d */ | head -n 1)" ] && [ ! -f "pubspec.yaml" ]; then
            mv $(ls -d */ | head -n 1)* ./
            mv $(ls -d */ | head -n 1).* ./ || true
          else
            mv ./* ../ || true
          fi
          cd ..
          rm -rf extracted_source

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: 'stable'

      # یہ وہ جادوئی سٹیپ ہے جو پروجیکٹ کے گریڈل اور پلگ انز کو جڑ سے بالکل نئے ورژن پر اپگریڈ کر دے گا
      - name: Complete Android Graduate/Plugin Upgrade
        run: |
          flutter clean
          
          # 1. گریڈل ریپر (Gradle Wrapper) کو 8.10.2 سے بڑھا کر 8.12 کرنا
          if [ -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i 's/gradle-[0-9.]*-all.zip/gradle-8.12-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties
          fi
          
          # 2. اینڈرائیڈ گریڈل پلگ ان (AGP) کو 8.7.0 سے زبردستی 8.12.0 کرنا تاکہ نیا فلٹر مطمئن ہو جائے
          find android -name "settings.gradle*" -exec sed -i 's/com.android.application" version "[0-9.]*"/com.android.application" version "8.12.0"/g' {} +
          find android -name "build.gradle*" -exec sed -i 's/id("com.android.application") version "[0-9.]*"/id("com.android.application") version "8.12.0"/g' {} +
          
          # 3. تمام ضروری SDK سیٹنگز کو اپگریڈ کرنا
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/compileSdk = [0-9]*/compileSdk = 36/g' android/app/build.gradle.kts
            sed -i '/android {/a \    ndkVersion = "28.2.13676358"' android/app/build.gradle.kts
          fi
          
          flutter pub get

      - name: Build Application APK
        run: |
          # اب اینڈرائیڈ کا پورا سسٹم بالکل نیا ہو چکا ہے، اس لیے بلڈ کامیابی سے مکمل ہوگا
          flutter build apk --debug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Flutter-Built-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
