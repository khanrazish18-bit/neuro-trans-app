
name: Auto Unzip and Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract ZIP file
        run: |
          unzip "neuro-trans-app (1).zip" -d extracted_source
          cd extracted_source
          if [ -d "$(ls -d */ | head -n 1)" ] && [ ! -f "pubspec.yaml" ]; then
            mv $(ls -d */ | head -n 1)* ./
            mv $(ls -d */ | head -n 1).* ./ || true
          else
            mv ./* ../ || true
          fi
          cd ..
          rm -rf extracted_source

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3' # ایم ایل کٹ کی ضرورت کے مطابق نیا ورژن
          channel: 'stable'

      # یہ سٹیپ پرانی فائل کو مٹا کر نئے فلٹر کے مطابق بالکل فریش فائل لکھ دے گا
      - name: Completely Rewrite Android Configuration
        run: |
          flutter clean
          
          # پرانی پریشان کن فائل کو بالکل صاف کرنا
          rm -f android/app/build.gradle.kts
          
          # نئے فلٹر ورژن کے مطابق بالکل نئی اور درست فائل خود بنانا
          cat << 'EOF' > android/app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("kotlin-android")
              id("dev.flutter.flutter-gradle-plugin")
          }

          android {
              namespace = "com.example.neurotransapp"
              compileSdk = 36
              ndkVersion = "28.2.13676358"

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              defaultConfig {
                  applicationId = "com.example.neurotransapp"
                  minSdk = 21
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0"
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
          }

          dependencies {}
          EOF
          
          flutter pub get

      - name: Build Application APK
        run: |
          # ورژن کی تمام سختیوں کو بائی پاس کر کے بلڈ مکمل کرنا
          flutter build apk --debug --android-skip-build-dependency-validation

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Flutter-Built-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
