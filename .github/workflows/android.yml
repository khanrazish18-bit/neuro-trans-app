name: Auto Unzip and Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract ZIP file
        run: |
          unzip "neuro-trans-app (1).zip" -d extracted_source
          cd extracted_source
          if [ -d "$(ls -d */ | head -n 1)" ] && [ ! -f "pubspec.yaml" ]; then
            mv $(ls -d */ | head -n 1)* ./
            mv $(ls -d */ | head -n 1).* ./ || true
          else
            mv ./* ../ || true
          fi
          cd ..
          rm -rf extracted_source

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: 'stable'

      # یہ سٹیپ اینڈرائیڈ کی دونوں پریشان کن فائلوں کو مٹا کر بالکل نئے ورژنز لکھ دے گا
      - name: Completely Rewrite Android Configuration
        run: |
          flutter clean
          
          # 1. پرانی سیٹنگز فائل کو مٹانا اور بالکل نیا گریڈل پلگ ان (8.9.1) لکھنا
          rm -f android/settings.gradle
          cat << 'EOF' > android/settings.gradle
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  def propertiesFile = new File(settingsDir, "local.properties")
                  if (propertiesFile.exists()) {
                      propertiesFile.withReader("UTF-8") { reader -> properties.load(reader) }
                  }
                  def sdkPath = properties.getProperty("flutter.sdk")
                  if (sdkPath == null) {
                      throw new GradleException("flutter.sdk not set in local.properties")
                  }
                  return sdkPath
              }
              plugins {
                  id "dev.flutter.flutter-gradle-plugin" version "1.0.0" apply false
              }
          }

          plugins {
              id "com.android.application" version "8.9.1" apply false
              id "org.jetbrains.kotlin.android" version "1.8.22" apply false
              id "dev.flutter.flutter-gradle-plugin" version "1.0.0" apply false
          }

          include ":app"
          EOF
          
          # 2. ایپ لیول کی بلڈ فائل کو نئے سرے سے درست لکھنا
          rm -f android/app/build.gradle.kts
          cat << 'EOF' > android/app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("kotlin-android")
              id("dev.flutter.flutter-gradle-plugin")
          }

          android {
              namespace = "com.example.neurotransapp"
              compileSdk = 36
              ndkVersion = "28.2.13676358"

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              defaultConfig {
                  applicationId = "com.example.neurotransapp"
                  minSdk = 21
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0"
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
          }

          dependencies {}
          EOF
          
          flutter pub get

      - name: Build Application APK
        run: |
          flutter build apk --debug --android-skip-build-dependency-validation

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Flutter-Built-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
