name: Auto Unzip and Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract ZIP file
        run: |
          unzip "neuro-trans-app (1).zip" -d extracted_source
          cd extracted_source
          if [ -d "$(ls -d */ | head -n 1)" ] && [ ! -f "pubspec.yaml" ]; then
            mv $(ls -d */ | head -n 1)* ./
            mv $(ls -d */ | head -n 1).* ./ || true
          else
            mv ./* ../ || true
          fi
          cd ..
          rm -rf extracted_source

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # فلٹر کا یہ ورژن پروجیکٹ کے پرانے طریقوں کو بغیر کسی سخت ورژن چیکنگ کے قبول کر لیتا ہے
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Fix Android Build Configuration
        run: |
          flutter clean
          cd android
          # اینڈرائیڈ ایس ڈی کے ورژنز کو سیٹ کرنا تاکہ ایم ایل کٹ خوش رہے
          find . -name "build.gradle" -exec sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 34/g' {} +
          find . -name "build.gradle" -exec sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 34/g' {} +
          find . -name "build.gradle.kts" -exec sed -i 's/compileSdk = [0-9]*/compileSdk = 34/g' {} +
          find . -name "build.gradle.kts" -exec sed -i 's/targetSdk = [0-9]*/targetSdk = 34/g' {} +
          cd ..
          flutter pub get

      - name: Build Application APK
        run: |
          # بغیر کسی سخت فلیگ کے سیدھا بلڈ
          flutter build apk --debug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Flutter-Built-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
