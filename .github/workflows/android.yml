name: Auto Unzip and Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract ZIP file
        run: |
          unzip "neuro-trans-app (1).zip" -d extracted_source
          cd extracted_source
          if [ -d "$(ls -d */ | head -n 1)" ] && [ ! -f "pubspec.yaml" ]; then
            mv $(ls -d */ | head -n 1)* ./
            mv $(ls -d */ | head -n 1).* ./ || true
          else
            mv ./* ../ || true
          fi
          cd ..
          rm -rf extracted_source

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: 'stable'

      # یہ سٹیپ تصویر 4 اور 5 کے مطابق تمام ورژنز (SDK 36 اور NDK 28) کو خودکار طور پر زبردستی اپگریڈ کر دے گا
      - name: Fix Android Build Configuration
        run: |
          flutter clean
          cd android/app
          
          # compileSdk کو 34 سے بدل کر 36 کرنا (جیسا تصویر 4 میں لکھا ہے)
          sed -i 's/compileSdk = 34/compileSdk = 36/g' build.gradle.kts
          
          # ndkVersion کو زبردستی نئے ورژن پر سیٹ کرنا (جیسا تصویر 5 میں لکھا ہے)
          sed -i '/android {/a \    ndkVersion = "28.2.13676358"' build.gradle.kts
          
          cd ../..
          flutter pub get

      - name: Build Application APK
        run: |
          # فلیگ کے ساتھ بلڈ رن کرنا تاکہ کوئی بھی پرانا ورژن کا ٹکراؤ بلڈ نہ روکے
          flutter build apk --debug --android-skip-build-dependency-validation

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Flutter-Built-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
